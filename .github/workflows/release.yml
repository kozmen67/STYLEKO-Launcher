name: unsigned-release-candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-release-x86:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and build final launcher
        shell: pwsh
        run: msbuild .\STYLEKO.Launcher.sln /restore /m /p:Configuration=Release /p:Platform=x86 /p:AssemblyName=Launcher

      - name: Upload SignPath input
        id: upload-signing-input
        uses: actions/upload-artifact@v4
        with:
          name: STYLEKO-Launcher-signing-input
          path: STYLEKO.Launcher\bin\x86\Release\net48\Launcher.exe
          if-no-files-found: error

      - name: Upload runtime test package
        uses: actions/upload-artifact@v4
        with:
          name: STYLEKO-Launcher-release-runtime
          path: STYLEKO.Launcher\bin\x86\Release\net48\
          if-no-files-found: error

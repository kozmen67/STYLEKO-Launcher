name: unsigned-release-candidate

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-release-x86:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and build final launcher
        shell: pwsh
        run: msbuild .\STYLEKO.Launcher.sln /restore /m /p:Configuration=Release /p:Platform=x86 /p:AssemblyName=Launcher

      - name: Upload SignPath input
        id: upload-signing-input
        uses: actions/upload-artifact@v4
        with:
          name: STYLEKO-Launcher-signing-input
          path: STYLEKO.Launcher\bin\x86\Release\net48\Launcher.exe
          if-no-files-found: error

      - name: Upload runtime test package
        uses: actions/upload-artifact@v4
        with:
          name: STYLEKO-Launcher-release-runtime
          path: STYLEKO.Launcher\bin\x86\Release\net48\
          if-no-files-found: error

      - name: Create public unsigned release package
        shell: pwsh
        run: |
          $src = "STYLEKO.Launcher\bin\x86\Release\net48"
          $stage = "release-package"
          $dist = "dist"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $stage -ItemType Directory -Force | Out-Null
          New-Item $dist -ItemType Directory -Force | Out-Null
          $files = @(
            "Launcher.exe",
            "Launcher.exe.config",
            "launcher_notice.html",
            "Microsoft.Web.WebView2.Core.dll",
            "Microsoft.Web.WebView2.WinForms.dll",
            "WebView2Loader.dll"
          )
          foreach ($file in $files) {
            Copy-Item (Join-Path $src $file) (Join-Path $stage $file) -Force
          }
          $hash = (Get-FileHash (Join-Path $src "Launcher.exe") -Algorithm SHA256).Hash
          @"
          STYLEKO Launcher v1.0.0.2 - UNSIGNED PUBLIC RELEASE

          This package contains the open-source STYLEKO Windows launcher component.
          It is intended for an existing STYLEKO game installation.

          Launcher.exe SHA-256:
          $hash

          Architecture:
          Windows x86

          Authenticode status:
          Unsigned

          Required existing STYLEKO client files/assets:
          - Server.ini
          - Path.ini
          - KnightOnLine.exe
          - Option.exe
          - StyleKO\LauncherWeb\
          - StyleKO\Guard\

          Source:
          https://github.com/kozmen67/STYLEKO-Launcher
          "@ | Set-Content (Join-Path $stage "README.txt") -Encoding UTF8
          Compress-Archive -Path "$stage\*" -DestinationPath "$dist\STYLEKO-Launcher-v1.0.0.2-unsigned.zip" -Force

      - name: Upload public unsigned release package
        uses: actions/upload-artifact@v4
        with:
          name: STYLEKO-Launcher-public-release
          path: dist\STYLEKO-Launcher-v1.0.0.2-unsigned.zip
          if-no-files-found: error

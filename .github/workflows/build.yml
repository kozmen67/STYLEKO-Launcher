name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x86:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Restore and build
        shell: pwsh
        run: msbuild .\STYLEKO.Launcher.sln /restore /m /p:Configuration=Release /p:Platform=x86
      - name: Upload unsigned test launcher
        uses: actions/upload-artifact@v4
        with:
          name: STYLEKO-Launcher-x86-unsigned
          path: STYLEKO.Launcher\bin\x86\Release\
          if-no-files-found: error
